[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hubctl"
version = "0.1.0"
description = "Terminal control app for the SmartUSBHub Pro 4CH"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
hubctl = "hubctl.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
